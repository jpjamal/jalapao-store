services:
  jalapao-store:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jalapao-store
    volumes:
      # o manual é enviado por SSH para ~/jalapao-store/manuais e servido daqui.
      # Fica fora do repositório de propósito — por isso o rsync do deploy
      # exclui essa pasta, senão o --delete apagaria o PDF a cada publicação.
      - ./manuais:/usr/share/nginx/html/manuais:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/jalapao-store/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      # sem start_period a primeira checagem so vinha aos 30s, e o Traefik
      # nao roteia container fora de "healthy" — o site ficava 404 nesse meio
      start_period: 5s
    restart: unless-stopped
    networks:
      - traefik_proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_proxy"

      # o site, aberto (sem senha, por decisão do dono da loja)
      - "traefik.http.routers.jalapao-store.rule=PathPrefix(`/jalapao-store`)"
      - "traefik.http.routers.jalapao-store.entrypoints=web"
      - "traefik.http.routers.jalapao-store.service=jalapao-store"

      # manuais dos produtos, rota pública para virar QR code no pacote
      - "traefik.http.routers.jalapao-manuais.rule=PathPrefix(`/manuais`)"
      - "traefik.http.routers.jalapao-manuais.entrypoints=web"
      - "traefik.http.routers.jalapao-manuais.service=jalapao-store"

      - "traefik.http.services.jalapao-store.loadbalancer.server.port=80"

  # ========== API DE PRODUTOS ==========
  # É o que tira a lista de dentro do navegador: os produtos passam a viver no
  # servidor e aparecem em qualquer aparelho. Leitura aberta, gravação com senha.
  jalapao-api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: jalapao-api
    volumes:
      # dados/ fica fora do repositório e fora do rsync --delete
      - ./dados:/dados
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8000/api/saude || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks:
      - traefik_proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_proxy"
      - "traefik.http.routers.jalapao-api.rule=PathPrefix(`/api/produtos`) || PathPrefix(`/api/saude`)"
      - "traefik.http.routers.jalapao-api.entrypoints=web"
      - "traefik.http.routers.jalapao-api.service=jalapao-api"
      - "traefik.http.services.jalapao-api.loadbalancer.server.port=8000"

networks:
  traefik_proxy:
    external: true
