# Produção na VPS — https://jpsys.duckdns.org/jalapao-store (e pelo IP).
#
# Proxy, HTTPS e certificados são do projeto traefikproxy (Traefik central, spec 019): este
# arquivo só declara, em labels, as rotas da loja. Não há Nginx nem Certbot aqui.
#
#   Internet → Traefik → jalapao-frontend (Next, único exposto) → jalapao-backend (rede interna)
#                      → jalapao-backend só em /jalapao-store/admin/ e /django-static/
#
# A rede traefik_proxy é dividida com outros sistemas, e o Docker registra o nome de cada
# serviço como nome de rede em todas as redes dele. Por isso os serviços têm nomes únicos:
# um "backend" ou "db" genérico poderia responder no lugar do container de outro projeto.
name: jalapao-store

# Endereços públicos: o domínio (certificado do Traefik) e o IP (certificado do certbot central).
x-origens: &origens https://217.216.82.25,https://jpsys.duckdns.org

services:
  jalapao-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: jalapao
      POSTGRES_USER: jalapao
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U jalapao -d jalapao']
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [internal]

  jalapao-backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Configure DJANGO_SECRET_KEY}
      DJANGO_ALLOWED_HOSTS: 217.216.82.25,jpsys.duckdns.org,localhost,127.0.0.1,jalapao-backend
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: jalapao-db
      CSRF_TRUSTED_ORIGINS: *origens
      # credenciais do marketplace: vêm do .env.backend, nunca do repositório
      SHOPEE_PARTNER_ID: ${SHOPEE_PARTNER_ID:-}
      SHOPEE_PARTNER_KEY: ${SHOPEE_PARTNER_KEY:-}
      SHOPEE_REDIRECT_URI: ${SHOPEE_REDIRECT_URI:-https://jpsys.duckdns.org/jalapao-store/callback}
      SHOPEE_API_BASE: ${SHOPEE_API_BASE:-https://openplatform.shopee.com.br}
      ML_APP_ID: ${ML_APP_ID:-}
      ML_CLIENT_SECRET: ${ML_CLIENT_SECRET:-}
      ML_REDIRECT_URI: ${ML_REDIRECT_URI:-https://jpsys.duckdns.org/jalapao-store/callback}
      ML_PKCE_ENABLED: ${ML_PKCE_ENABLED:-0}
      # fotos dos produtos no servidor de arquivos (SILO, do traefikproxy; spec 020). A chave é
      # gerada lá, na VPS, e o deploy.sh a entrega por --env-file: nunca passa pelo GitHub.
      S3_ENDPOINT_URL: http://silo:9000
      S3_BUCKET: jalapao-media
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Falta a credencial do SILO (.env.silo.jalapao-store)}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?Falta a credencial do SILO (.env.silo.jalapao-store)}
    volumes:
      - './dados:/legacy:ro'
      # certificado do IP, do certbot central, só para avisar no painel antes de vencer
      - 'infra_certificates:/certs:ro'
    depends_on:
      jalapao-db: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    # traefik_proxy só por causa do Django Admin; a API não tem rota pública (o front usa a
    # rede interna). A documentação da API fica para o ambiente local. infra_storage: o SILO.
    networks: [internal, traefik_proxy, infra_storage]
    labels:
      traefik.enable: 'true'
      traefik.docker.network: traefik_proxy
      traefik.http.services.jalapao-backend.loadbalancer.server.port: '8000'
      traefik.http.routers.jalapao-admin-duckdns.rule: Host(`jpsys.duckdns.org`) && (PathPrefix(`/jalapao-store/admin/`) || PathPrefix(`/jalapao-store/django-static/`))
      traefik.http.routers.jalapao-admin-duckdns.entrypoints: websecure
      traefik.http.routers.jalapao-admin-duckdns.tls: 'true'
      traefik.http.routers.jalapao-admin-duckdns.tls.certresolver: duckdns
      traefik.http.routers.jalapao-admin-duckdns.priority: '200'
      traefik.http.routers.jalapao-admin-duckdns.middlewares: secure-headers@file
      traefik.http.routers.jalapao-admin-duckdns.service: jalapao-backend
      traefik.http.routers.jalapao-admin-ip.rule: Host(`217.216.82.25`) && (PathPrefix(`/jalapao-store/admin/`) || PathPrefix(`/jalapao-store/django-static/`))
      traefik.http.routers.jalapao-admin-ip.entrypoints: websecure
      traefik.http.routers.jalapao-admin-ip.tls: 'true'
      traefik.http.routers.jalapao-admin-ip.priority: '200'
      traefik.http.routers.jalapao-admin-ip.middlewares: secure-headers@file
      traefik.http.routers.jalapao-admin-ip.service: jalapao-backend

  jalapao-frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      BACKEND_URL: http://jalapao-backend:8000
      APP_ORIGIN: *origens
      COOKIE_SECURE: 'true'
    depends_on:
      jalapao-backend: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/jalapao-store/login').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [internal, traefik_proxy]
    labels:
      traefik.enable: 'true'
      traefik.docker.network: traefik_proxy
      traefik.http.services.jalapao-frontend.loadbalancer.server.port: '3000'
      # fotos de produto sobem pelo BFF do front: mesmo limite que o backend aceita (10 MB + margem)
      traefik.http.middlewares.jalapao-uploads.buffering.maxRequestBodyBytes: '11534336'
      # o retorno da autorização leva o código na URL: não vazar por Referer
      traefik.http.middlewares.jalapao-callback-headers.headers.referrerPolicy: no-referrer
      traefik.http.middlewares.jalapao-callback-headers.headers.contentTypeNosniff: 'true'
      traefik.http.middlewares.jalapao-callback-headers.headers.customFrameOptionsValue: SAMEORIGIN
      # HTTP → HTTPS (domínio ou IP), pelo middleware central
      traefik.http.routers.jalapao-http.rule: PathPrefix(`/jalapao-store`)
      traefik.http.routers.jalapao-http.entrypoints: web
      traefik.http.routers.jalapao-http.middlewares: redirect-to-https@file
      traefik.http.routers.jalapao-http.service: jalapao-frontend
      traefik.http.routers.jalapao-duckdns.rule: Host(`jpsys.duckdns.org`) && PathPrefix(`/jalapao-store`)
      traefik.http.routers.jalapao-duckdns.entrypoints: websecure
      traefik.http.routers.jalapao-duckdns.tls: 'true'
      traefik.http.routers.jalapao-duckdns.tls.certresolver: duckdns
      traefik.http.routers.jalapao-duckdns.middlewares: secure-headers@file,jalapao-uploads
      traefik.http.routers.jalapao-duckdns.service: jalapao-frontend
      # pelo IP vale o certificado padrão do Traefik (o do IP)
      traefik.http.routers.jalapao-ip.rule: Host(`217.216.82.25`) && PathPrefix(`/jalapao-store`)
      traefik.http.routers.jalapao-ip.entrypoints: websecure
      traefik.http.routers.jalapao-ip.tls: 'true'
      traefik.http.routers.jalapao-ip.middlewares: secure-headers@file,jalapao-uploads
      traefik.http.routers.jalapao-ip.service: jalapao-frontend
      traefik.http.routers.jalapao-callback-duckdns.rule: Host(`jpsys.duckdns.org`) && Path(`/jalapao-store/callback`)
      traefik.http.routers.jalapao-callback-duckdns.entrypoints: websecure
      traefik.http.routers.jalapao-callback-duckdns.tls: 'true'
      traefik.http.routers.jalapao-callback-duckdns.tls.certresolver: duckdns
      traefik.http.routers.jalapao-callback-duckdns.priority: '300'
      traefik.http.routers.jalapao-callback-duckdns.middlewares: jalapao-callback-headers
      traefik.http.routers.jalapao-callback-duckdns.service: jalapao-frontend
      traefik.http.routers.jalapao-callback-ip.rule: Host(`217.216.82.25`) && Path(`/jalapao-store/callback`)
      traefik.http.routers.jalapao-callback-ip.entrypoints: websecure
      traefik.http.routers.jalapao-callback-ip.tls: 'true'
      traefik.http.routers.jalapao-callback-ip.priority: '300'
      traefik.http.routers.jalapao-callback-ip.middlewares: jalapao-callback-headers
      traefik.http.routers.jalapao-callback-ip.service: jalapao-frontend
      # Manuais em PDF (link do QR code do produto): /manuais/<arquivo> é o objeto de mesmo nome
      # no bucket jalapao-manuais do SILO, que só aceita leitura de objeto por anônimo (listar
      # não). O serviço silo-s3 é declarado no traefikproxy.
      traefik.http.middlewares.jalapao-manuais-bucket.replacepathregex.regex: ^/manuais/(.+)$$
      traefik.http.middlewares.jalapao-manuais-bucket.replacepathregex.replacement: /jalapao-manuais/$$1
      traefik.http.routers.jalapao-manuais-http.rule: PathPrefix(`/manuais/`)
      traefik.http.routers.jalapao-manuais-http.entrypoints: web
      traefik.http.routers.jalapao-manuais-http.middlewares: redirect-to-https@file
      traefik.http.routers.jalapao-manuais-http.service: silo-s3@docker
      traefik.http.routers.jalapao-manuais-duckdns.rule: Host(`jpsys.duckdns.org`) && PathPrefix(`/manuais/`)
      traefik.http.routers.jalapao-manuais-duckdns.entrypoints: websecure
      traefik.http.routers.jalapao-manuais-duckdns.tls: 'true'
      traefik.http.routers.jalapao-manuais-duckdns.tls.certresolver: duckdns
      traefik.http.routers.jalapao-manuais-duckdns.middlewares: secure-headers@file,jalapao-manuais-bucket
      traefik.http.routers.jalapao-manuais-duckdns.service: silo-s3@docker
      traefik.http.routers.jalapao-manuais-ip.rule: Host(`217.216.82.25`) && PathPrefix(`/manuais/`)
      traefik.http.routers.jalapao-manuais-ip.entrypoints: websecure
      traefik.http.routers.jalapao-manuais-ip.tls: 'true'
      traefik.http.routers.jalapao-manuais-ip.middlewares: secure-headers@file,jalapao-manuais-bucket
      traefik.http.routers.jalapao-manuais-ip.service: silo-s3@docker

volumes:
  postgres_data:
  # do traefikproxy: precisa existir antes (o deploy.sh confere)
  infra_certificates:
    external: true

networks:
  internal:
  traefik_proxy:
    external: true
  infra_storage:
    external: true
