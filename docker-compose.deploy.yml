name: jalapao-store
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: jalapao
      POSTGRES_USER: jalapao
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U jalapao -d jalapao']
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [internal]
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Configure DJANGO_SECRET_KEY}
      DJANGO_ALLOWED_HOSTS: 217.216.82.25,localhost,127.0.0.1,backend
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      CSRF_TRUSTED_ORIGINS: https://217.216.82.25
      # credenciais do marketplace: vêm do .env.backend, nunca do repositório
      SHOPEE_PARTNER_ID: ${SHOPEE_PARTNER_ID:-}
      SHOPEE_PARTNER_KEY: ${SHOPEE_PARTNER_KEY:-}
      SHOPEE_REDIRECT_URI: ${SHOPEE_REDIRECT_URI:-https://217.216.82.25/jalapao-store/callback}
      SHOPEE_API_BASE: ${SHOPEE_API_BASE:-https://openplatform.shopee.com.br}
      ML_APP_ID: ${ML_APP_ID:-}
      ML_CLIENT_SECRET: ${ML_CLIENT_SECRET:-}
      ML_REDIRECT_URI: ${ML_REDIRECT_URI:-https://217.216.82.25/jalapao-store/callback}
      ML_PKCE_ENABLED: ${ML_PKCE_ENABLED:-0}
    volumes:
      - './dados:/legacy:ro'
      # somente leitura, só para avisar no painel antes do certificado vencer
      - 'certificates:/certs:ro'
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [internal]
  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8000
      APP_ORIGIN: https://217.216.82.25
      COOKIE_SECURE: 'true'
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/jalapao-store/login').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [internal]
  gateway:
    image: nginx:stable-alpine
    restart: unless-stopped
    volumes:
      - ./infra/nginx/http.conf:/etc/nginx/conf.d/default.conf:ro
      - acme_webroot:/var/www/certbot:ro
      - certificates:/etc/letsencrypt:ro
    depends_on:
      frontend: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://127.0.0.1/health']
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [internal, traefik_proxy]
    labels:
      traefik.enable: 'true'
      traefik.docker.network: traefik_proxy
      traefik.http.routers.jalapao-store.rule: 'PathPrefix(`/jalapao-store`)'
      traefik.http.routers.jalapao-store.entrypoints: web
      traefik.http.routers.jalapao-store.service: jalapao-store
      traefik.http.routers.jalapao-manuais.rule: 'PathPrefix(`/manuais`)'
      traefik.http.routers.jalapao-manuais.entrypoints: web
      traefik.http.routers.jalapao-manuais.service: jalapao-store
      traefik.http.routers.jalapao-acme.rule: 'Host(`217.216.82.25`) && PathPrefix(`/.well-known/acme-challenge/`)'
      traefik.http.routers.jalapao-acme.entrypoints: web
      traefik.http.routers.jalapao-acme.service: jalapao-store
      traefik.http.services.jalapao-store.loadbalancer.server.port: '80'
  tls:
    image: nginx:stable-alpine
    profiles: [https]
    restart: unless-stopped
    ports: ['443:443']
    volumes:
      - ./infra/nginx/https.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/nginx/locations.conf:/etc/nginx/jalapao-locations.conf:ro
      - ./infra/renew-nginx.sh:/renew-nginx.sh:ro
      - ./manuais:/srv/manuais:ro
      - certificates:/etc/letsencrypt:ro
    command: [sh, /renew-nginx.sh]
    depends_on:
      frontend: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, 'wget --no-check-certificate -q -O /dev/null https://127.0.0.1/health']
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [internal]
  certbot:
    image: certbot/certbot:v5.4.0
    profiles: [https]
    restart: unless-stopped
    volumes:
      - certificates:/etc/letsencrypt
      - acme_webroot:/var/www/certbot
    entrypoint: /bin/sh
    # Depois de cada tentativa de renovação, deixa uma cópia legível do certificado em
    # publico/: o certbot cria live/ como 0700 de root e o backend roda sem privilégio,
    # então não alcançaria a validade para avisar no painel. O certificado é público —
    # é o mesmo que o proxy entrega a qualquer visitante.
    command:
      - '-c'
      - 'trap exit TERM; mkdir -p /etc/letsencrypt/publico; while :; do certbot renew --quiet;
         cp -f /etc/letsencrypt/live/jalapao-ip/cert.pem /etc/letsencrypt/publico/cert.pem 2>/dev/null
         && chmod 644 /etc/letsencrypt/publico/cert.pem; sleep 43200 & wait $$!; done'
    networks: [internal]
volumes:
  postgres_data:
  certificates:
  acme_webroot:
networks:
  internal:
  traefik_proxy:
    external: true
