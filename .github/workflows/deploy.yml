name: Deploy Jalapao Store

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  APP_NAME: jalapao-store
  COMPOSE_FILE: docker-compose.deploy.yml

jobs:
  # ========== TEST ==========
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Print de mensagem usando python
        run: |
          python - <<'EOF'
          print("✅ Testes de unidade e smoke tests passaram (placeholder)")
          EOF

      # - name: Install dependencies
      #   run: pip install -r requirements.txt

      # - name: Streamlit smoke test
      #   run: |
      #     python - <<'EOF'
      #     from streamlit.testing.v1 import AppTest
      #     at = AppTest.from_file("app.py", default_timeout=30)
      #     at.run()
      #     assert not at.exception, f"app.py raised: {at.exception}"
      #     EOF

  # ========== BUILD ==========
  quality:
    name: Django PostgreSQL and Next.js
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: jalapao
          POSTGRES_USER: jalapao
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U jalapao -d jalapao'
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      DJANGO_SECRET_KEY: ci-only-secret-key-not-for-production-1234567890
      POSTGRES_HOST: localhost
      POSTGRES_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.18'
          python-version: '3.13'
      - name: Backend checks and PostgreSQL tests
        working-directory: backend
        run: |
          uv sync --frozen
          uv run ruff check . --exclude migrations
          uv run python manage.py check
          uv run python manage.py makemigrations --check --dry-run
          uv run python manage.py test apps.common --verbosity 2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend build and type validation
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

  build:
    name: Build
    needs: [test, quality]
    env:
      POSTGRES_PASSWORD: build-only-not-for-production
      DJANGO_SECRET_KEY: build-only-not-for-production-secret-key-1234567890
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate compose file
        env:
          APP_NAME: ${{ env.APP_NAME }}
        run: docker compose -f ${{ env.COMPOSE_FILE }} config > /dev/null

      - name: Build Docker image
        run: docker compose -f ${{ env.COMPOSE_FILE }} build

  # ========== DEPLOY ==========
  deploy:
    name: Deploy to production
    needs: [test, quality, build]
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ vars.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Ensure directory exists
        run: |
          ssh -i ~/.ssh/deploy_key ${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }} \
            "mkdir -p ~/${{ env.APP_NAME }}/data ~/backups/jalapao-store; chmod 700 ~/backups/jalapao-store; if [ -f ~/${{ env.APP_NAME }}/docker-compose.deploy.yml ]; then tar -czf ~/backups/jalapao-store/before-${{ github.sha }}.tgz -C ~/${{ env.APP_NAME }} docker-compose.deploy.yml Dockerfile nginx-site.conf site api; chmod 600 ~/backups/jalapao-store/before-${{ github.sha }}.tgz; fi"

      - name: Sync files to server
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.claude/' \
            --exclude='__pycache__/' \
            --exclude='*.pyc' \
            --exclude='.venv/' \
            --exclude='node_modules/' \
            --exclude='.next/' \
            --exclude='README.md' \
            --exclude='CLAUDE.md' \
            --exclude='.python-version' \
            --exclude='data/' \
            --exclude='manuais/' \
            --exclude='dados/' \
            ./ ${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}:~/${{ env.APP_NAME }}/

      - name: Generate .env.production on server
        env:
          APP_NAME: ${{ env.APP_NAME }}
        run: |
          echo '${{ toJSON(vars) }}' | jq -r '
            to_entries
            | map(select(.key | test("^(DEPLOY_HOST|DEPLOY_USER)$") | not))
            | .[] | "\(.key)=\(.value)"
          ' > /tmp/.env.production

          echo "APP_NAME=$APP_NAME" >> /tmp/.env.production

          scp -i ~/.ssh/deploy_key /tmp/.env.production \
            ${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}:~/${{ env.APP_NAME }}/.env.production
          ssh -i ~/.ssh/deploy_key ${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }} \
            "chmod 600 ~/${{ env.APP_NAME }}/.env.production"
          echo "✅ .env.production gerado"

      - name: Deploy
        run: |
          ssh -i ~/.ssh/deploy_key ${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }} bash << 'EOF'
            set -e
            cd ~/${{ env.APP_NAME }}

            bash infra/deploy.sh
          EOF
