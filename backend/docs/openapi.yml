          - in
          - out
        description: |-
          * `in` - Entrada
          * `out` - Saída
      - name: ordering
        required: false
        in: query
        description: Qual campo usar ao ordenar os resultados.
        schema:
          type: string
      - in: query
        name: origin
        schema:
          type: string
          enum:
          - manual
          - purchase
          - purchase_refund
          - sale
          - sale_refund
          - supply
          - supply_refund
        description: |-
          * `sale` - Venda
          * `sale_refund` - Estorno de venda
          * `purchase` - Compra de estoque
          * `purchase_refund` - Estorno de compra de estoque
          * `supply` - Compra de insumo
          * `supply_refund` - Estorno de compra de insumo
          * `manual` - Manual
      - name: page
        required: false
        in: query
        description: Um número de página dentro do conjunto de resultados paginado.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: Um termo de busca.
        schema:
          type: string
      tags:
      - cash
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCashSummaryList'
          description: ''
  /categories/:
    get:
      operationId: categories_list
      description: 'Sem DELETE: categoria sai de uso desativando (`active`), como
        o produto.'
      parameters:
      - in: query
        name: active
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: Qual campo usar ao ordenar os resultados.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: Um número de página dentro do conjunto de resultados paginado.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: Um termo de busca.
        schema:
          type: string
      - in: query
        name: uses_printing_profile
        schema:
          type: boolean
      tags:
      - categories
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCategoryList'
          description: ''
    post:
      operationId: categories_create
      description: 'Sem DELETE: categoria sai de uso desativando (`active`), como
        o produto.'
      tags:
      - categories
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Category'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Category'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Category'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
          description: ''
  /categories/{id}/:
    get:
      operationId: categories_retrieve
      description: 'Sem DELETE: categoria sai de uso desativando (`active`), como
        o produto.'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Um string UUID que identifica este category.
        required: true
      tags:
      - categories
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
          description: ''
    put:
      operationId: categories_update
      description: 'Sem DELETE: categoria sai de uso desativando (`active`), como
        o produto.'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Um string UUID que identifica este category.
