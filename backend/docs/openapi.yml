          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCash'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cash'
          description: ''
  /cash/summary/:
    get:
      operationId: cash_summary_list
      description: Entradas e saídas somadas por categoria, de todos os lançamentos.
      parameters:
