openapi: 3.0.3
info:
  title: Jalapão Store API
  version: 1.0.0
paths:
  /auth/logout/:
    post:
      operationId: auth_logout_create
      description: |-
        Takes a token and blacklists it. Must be used with the
        `rest_framework_simplejwt.token_blacklist` app installed.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenBlacklist'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenBlacklist'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenBlacklist'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenBlacklist'
          description: ''
  /auth/me/:
    get:
      operationId: auth_me_retrieve
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
          description: ''
  /auth/refresh/:
    post:
      operationId: auth_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /auth/token/:
    post:
      operationId: auth_token_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: ''
  /cash/:
    get:
      operationId: cash_list
      parameters:
      - in: query
        name: direction
        schema:
          type: string
          enum:
          - in
          - out
        description: |-
          * `in` - Entrada
          * `out` - Saída
      - name: page
        required: false
        in: query
        description: Um número de página dentro do conjunto de resultados paginado.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: Um termo de busca.
        schema:
          type: string
      tags:
      - cash
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCashList'
          description: ''
    post:
      operationId: cash_create
      tags:
      - cash
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Cash'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Cash'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Cash'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cash'
          description: ''
  /dashboard/:
    get:
      operationId: dashboard_retrieve
      tags:
      - dashboard
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dashboard'
          description: ''
  /integrations/:
    get:
      operationId: integrations_list
      description: Lojas conectadas. Conectar e sincronizar exigem permissão de escrita.
      parameters:
      - in: query
        name: active
        schema:
          type: boolean
      - in: query
        name: channel
        schema:
          type: string
          enum:
          - mercado_livre
          - shopee
        description: |-
          * `shopee` - Shopee
          * `mercado_livre` - Mercado Livre
      - name: page
        required: false
        in: query
        description: Um número de página dentro do conjunto de resultados paginado.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: Um termo de busca.
        schema:
          type: string
      tags:
      - integrations
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAccountList'
          description: ''
  /integrations/{id}/:
    get:
      operationId: integrations_retrieve
      description: Lojas conectadas. Conectar e sincronizar exigem permissão de escrita.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Um string UUID que identifica este marketplace account.
        required: true
      tags:
      - integrations
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
          description: ''
  /integrations/{id}/import-listings/:
    post:
      operationId: integrations_import_listings_create
      description: Lojas conectadas. Conectar e sincronizar exigem permissão de escrita.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Um string UUID que identifica este marketplace account.
        required: true
      tags:
      - integrations
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportResult'
          description: ''
  /integrations/{id}/push-stock/:
    post:
      operationId: integrations_push_stock_create
      description: Lojas conectadas. Conectar e sincronizar exigem permissão de escrita.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Um string UUID que identifica este marketplace account.
        required: true
      tags:
      - integrations
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PushStockResult'
          description: ''
  /integrations/auth-link/:
    get:
      operationId: integrations_auth_link_retrieve
      description: Lojas conectadas. Conectar e sincronizar exigem permissão de escrita.
      parameters:
      - in: query
        name: channel
        schema:
          type: string
          minLength: 1
        required: true
      tags:
      - integrations
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthLink'
          description: ''
  /integrations/connect/:
    post:
      operationId: integrations_connect_create
      description: Lojas conectadas. Conectar e sincronizar exigem permissão de escrita.
      tags:
      - integrations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ConnectRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ConnectRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
          description: ''
  /integrations/ml-auth-link/:
    post:
      operationId: integrations_ml_auth_link_create
      description: Lojas conectadas. Conectar e sincronizar exigem permissão de escrita.
      tags:
      - integrations
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MlAuthLink'
          description: ''
  /integrations/price-best-sellers/:
    get:
      operationId: integrations_price_best_sellers_retrieve
      description: Lojas conectadas. Conectar e sincronizar exigem permissão de escrita.
      parameters:
      - in: query
        name: category_id
        schema:
          type: string
        required: true
      tags:
      - integrations
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceBestSellers'
          description: ''
  /integrations/price-products/:
    get:
      operationId: integrations_price_products_retrieve
      description: Lojas conectadas. Conectar e sincronizar exigem permissão de escrita.
      parameters:
      - in: query
        name: gtin
        schema:
          type: string
        description: Código de barras (EAN)
      - in: query
        name: q
        schema:
          type: string
        description: Palavras do produto
      tags:
      - integrations
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceProducts'
          description: ''
  /integrations/status/:
    get:
      operationId: integrations_status_retrieve
      description: Lojas conectadas. Conectar e sincronizar exigem permissão de escrita.
      tags:
      - integrations
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountStatus'
          description: ''
  /listing-drafts/:
    get:
      operationId: listing_drafts_list
      parameters:
      - in: query
        name: channel
        schema:
          type: string
          enum:
          - mercado_livre
          - shopee
        description: |-
          * `mercado_livre` - Mercado Livre
          * `shopee` - Shopee
      - name: page
        required: false
        in: query
        description: Um número de página dentro do conjunto de resultados paginado.
        schema:
          type: integer
      - in: query
        name: product
        schema:
          type: string
          format: uuid
      - name: search
        required: false
        in: query
        description: Um termo de busca.
        schema:
          type: string
      tags:
      - listing-drafts
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedListingDraftList'
          description: ''
    post:
      operationId: listing_drafts_create
      tags:
      - listing-drafts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListingDraft'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ListingDraft'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ListingDraft'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListingDraft'
          description: ''
  /listing-drafts/{id}/:
    get:
      operationId: listing_drafts_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Um string UUID que identifica este listing draft.
        required: true
      tags:
      - listing-drafts
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListingDraft'
          description: ''
    put:
      operationId: listing_drafts_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Um string UUID que identifica este listing draft.
        required: true
      tags:
      - listing-drafts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListingDraft'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ListingDraft'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ListingDraft'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListingDraft'
          description: ''
    patch:
      operationId: listing_drafts_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Um string UUID que identifica este listing draft.
        required: true
      tags:
      - listing-drafts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedListingDraft'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedListingDraft'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedListingDraft'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListingDraft'
          description: ''
  /listing-drafts/{id}/publish/:
    post:
      operationId: listing_drafts_publish_create
      description: Publica de verdade no Mercado Livre. Valida de novo antes; nunca
        publica duas vezes.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Um string UUID que identifica este listing draft.
        required: true
      tags:
      - listing-drafts
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftPublication'
          description: ''
  /listing-drafts/{id}/push/:
    post:
      operationId: listing_drafts_push_create
      description: |-
        Envia ao anúncio já publicado o que mudou no rascunho: preço, fotos, atributos e
        descrição.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Um string UUID que identifica este listing draft.
        required: true
      tags:
      - listing-drafts
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftPublication'
          description: ''
  /listing-drafts/{id}/validate/:
    post:
      operationId: listing_drafts_validate_create
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Um string UUID que identifica este listing draft.
        required: true
      tags:
      - listing-drafts
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftValidation'
          description: ''
  /listing-drafts/ml-attributes/:
    get:
      operationId: listing_drafts_ml_attributes_retrieve
      parameters:
      - in: query
        name: category_id
        schema:
          type: string
        required: true
      tags:
      - listing-drafts
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MlCategoryAttributes'
          description: ''
  /listing-drafts/ml-categories/:
    get:
      operationId: listing_drafts_ml_categories_list
      parameters:
      - in: query
        name: channel
        schema:
          type: string
          enum:
          - mercado_livre
          - shopee
        description: |-
          * `mercado_livre` - Mercado Livre
          * `shopee` - Shopee
      - name: page
        required: false
        in: query
        description: Um número de página dentro do conjunto de resultados paginado.
        schema:
          type: integer
      - in: query
        name: product
        schema:
          type: string
          format: uuid
      - in: query
        name: q
        schema:
          type: string
        description: Título do anúncio
        required: true
      - name: search
        required: false
        in: query
        description: Um termo de busca.
        schema:
          type: string
      tags:
      - listing-drafts
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMlCategorySuggestionList'
          description: ''
  /listing-drafts/ml-category-tree/:
    get:
      operationId: listing_drafts_ml_category_tree_retrieve
      description: Um nível da árvore de categorias do Mercado Livre, para escolher
        navegando.
      parameters:
      - in: query
        name: category_id
        schema:
          type: string
        description: Vazio devolve o primeiro nível
      tags:
      - listing-drafts
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MlCategoryTree'
          description: ''
  /listings/:
    get:
      operationId: listings_list
      description: Vínculos anúncio ↔ produto. O que se edita aqui é o interruptor
        e o produto.
      parameters:
      - in: query
        name: marketplace
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: Um número de página dentro do conjunto de resultados paginado.
        schema:
          type: integer
      - in: query
        name: product
        schema:
          type: string
          format: uuid
      - name: search
        required: false
        in: query
        description: Um termo de busca.
        schema:
          type: string
      - in: query
        name: sync_enabled
        schema:
          type: boolean
      tags:
      - listings
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedListingList'
          description: ''
  /listings/{id}/:
    put:
      operationId: listings_update
      description: Vínculos anúncio ↔ produto. O que se edita aqui é o interruptor
        e o produto.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Um string UUID que identifica este listing.
        required: true
      tags:
      - listings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Listing'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Listing'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Listing'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Listing'
          description: ''
    patch:
      operationId: listings_partial_update
      description: Vínculos anúncio ↔ produto. O que se edita aqui é o interruptor
        e o produto.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Um string UUID que identifica este listing.
        required: true
      tags:
      - listings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedListing'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedListing'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedListing'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Listing'
          description: ''
  /movements/:
    get:
      operationId: movements_list
      parameters:
      - name: page
        required: false
        in: query
        description: Um número de página dentro do conjunto de resultados paginado.
        schema:
          type: integer
      - in: query
        name: product
        schema:
          type: string
          format: uuid
      - name: search
        required: false
        in: query
        description: Um termo de busca.
        schema:
          type: string
      tags:
      - movements
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMovementList'
          description: ''
    post:
      operationId: movements_create
      tags:
      - movements
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Movement'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Movement'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Movement'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Movement'
          description: ''
  /product-images/:
    get:
      operationId: product_images_list
      parameters:
      - name: page
        required: false
        in: query
        description: Um número de página dentro do conjunto de resultados paginado.
        schema:
          type: integer
      - in: query
        name: product
        schema:
          type: string
          format: uuid
      - name: search
        required: false
        in: query
        description: Um termo de busca.
        schema:
          type: string
      tags:
      - product-images
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProductImageList'
          description: ''
    post:
      operationId: product_images_create
      tags:
      - product-images
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProductImageUpload'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ProductImageUpload'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductImage'
          description: ''
  /product-images/{id}/:
    delete:
      operationId: product_images_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Um string UUID que identifica este product image.
        required: true
      tags:
      - product-images
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /product-images/{id}/content/:
    get:
      operationId: product_images_content_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Um string UUID que identifica este product image.
        required: true
      tags:
      - product-images
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: string
                format: binary
          description: ''
  /products/:
    get:
      operationId: products_list
      parameters:
      - in: query
        name: active
        schema:
          type: boolean
      - in: query
        name: kind
        schema:
          type: string
          enum:
          - printing
          - resale
        description: |-
          * `printing` - Impressão 3D
          * `resale` - Revenda
      - name: page
        required: false
        in: query
