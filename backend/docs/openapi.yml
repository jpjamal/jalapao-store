openapi: 3.0.3
info:
  title: Jalapão Store API
  version: 1.0.0
paths:
  /auth/logout/:
    post:
      operationId: auth_logout_create
      description: |-
        Takes a token and blacklists it. Must be used with the
        `rest_framework_simplejwt.token_blacklist` app installed.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenBlacklist'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenBlacklist'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenBlacklist'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenBlacklist'
          description: ''
  /auth/me/:
    get:
      operationId: auth_me_retrieve
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
          description: ''
  /auth/refresh/:
    post:
      operationId: auth_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /auth/token/:
    post:
      operationId: auth_token_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: ''
  /cash/:
    get:
      operationId: cash_list
      parameters:
      - in: query
        name: direction
        schema:
          type: string
          enum:
          - in
          - out
        description: |-
          * `in` - Entrada
          * `out` - Saída
      - name: page
        required: false
        in: query
        description: Um número de página dentro do conjunto de resultados paginado.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: Um termo de busca.
        schema:
          type: string
      tags:
      - cash
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCashList'
          description: ''
    post:
      operationId: cash_create
      tags:
      - cash
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Cash'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Cash'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Cash'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cash'
          description: ''
  /dashboard/:
    get:
      operationId: dashboard_retrieve
      tags:
      - dashboard
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dashboard'
          description: ''
  /movements/:
    get:
      operationId: movements_list
      parameters:
      - name: page
        required: false
        in: query
        description: Um número de página dentro do conjunto de resultados paginado.
        schema:
          type: integer
      - in: query
        name: product
        schema:
          type: string
          format: uuid
      - name: search
        required: false
        in: query
        description: Um termo de busca.
        schema:
          type: string
      tags:
      - movements
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMovementList'
          description: ''
    post:
      operationId: movements_create
      tags:
      - movements
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Movement'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Movement'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Movement'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Movement'
          description: ''
  /products/:
    get:
      operationId: products_list
      parameters:
      - in: query
        name: active
        schema:
          type: boolean
      - in: query
        name: kind
        schema:
          type: string
          enum:
          - printing
          - resale
        description: |-
          * `printing` - Impressão 3D
          * `resale` - Revenda
      - name: page
        required: false
        in: query
        description: Um número de página dentro do conjunto de resultados paginado.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: Um termo de busca.
        schema:
          type: string
      tags:
      - products
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProductList'
          description: ''
    post:
      operationId: products_create
      tags:
      - products
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Product'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Product'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Product'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
          description: ''
  /products/{id}/:
    get:
      operationId: products_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Um string UUID que identifica este product.
        required: true
      tags:
      - products
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
          description: ''
    put:
      operationId: products_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Um string UUID que identifica este product.
        required: true
      tags:
      - products
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Product'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Product'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Product'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
          description: ''
    patch:
      operationId: products_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Um string UUID que identifica este product.
        required: true
      tags:
      - products
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProduct'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedProduct'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedProduct'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
          description: ''
  /receipts/:
    get:
      operationId: receipts_list
      parameters:
      - in: query
        name: kind
        schema:
          type: string
          enum:
          - production
          - purchase
        description: |-
          * `purchase` - Compra
          * `production` - Produção
      - name: page
        required: false
        in: query
        description: Um número de página dentro do conjunto de resultados paginado.
        schema:
          type: integer
      - in: query
        name: product
        schema:
          type: string
          format: uuid
      - name: search
        required: false
        in: query
        description: Um termo de busca.
        schema:
          type: string
      tags:
      - receipts
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedReceiptList'
          description: ''
    post:
      operationId: receipts_create
      tags:
      - receipts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReceiptInput'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ReceiptInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ReceiptInput'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Receipt'
          description: ''
  /receipts/{id}/:
    get:
      operationId: receipts_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Um string UUID que identifica este receipt.
        required: true
      tags:
      - receipts
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Receipt'
          description: ''
  /receipts/{id}/pay/:
    post:
      operationId: receipts_pay_create
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Um string UUID que identifica este receipt.
        required: true
      tags:
      - receipts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentInput'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PaymentInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PaymentInput'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Receipt'
          description: ''
  /sales/:
    get:
      operationId: sales_list
      parameters:
      - in: query
        name: channel
        schema:
          type: string
          enum:
          - direct
          - mercado_livre
          - other
          - shopee
        description: |-
          * `direct` - Boca a boca
          * `mercado_livre` - Mercado Livre
          * `shopee` - Shopee
          * `other` - Outro
      - name: page
        required: false
        in: query
        description: Um número de página dentro do conjunto de resultados paginado.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: Um termo de busca.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - cancelled
          - confirmed
        description: |-
          * `confirmed` - Confirmada
          * `cancelled` - Cancelada
      tags:
      - sales
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSaleList'
          description: ''
    post:
      operationId: sales_create
      tags:
      - sales
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaleInput'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SaleInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SaleInput'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sale'
          description: ''
  /sales/{id}/:
    get:
      operationId: sales_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Um string UUID que identifica este sale.
        required: true
      tags:
      - sales
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sale'
          description: ''
  /sales/{id}/cancel/:
    post:
      operationId: sales_cancel_create
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Um string UUID que identifica este sale.
        required: true
      tags:
      - sales
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sale'
          description: ''
  /sales/{id}/receive/:
    post:
      operationId: sales_receive_create
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Um string UUID que identifica este sale.
        required: true
      tags:
      - sales
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sale'
          description: ''
components:
  schemas:
    Cash:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        direction:
          $ref: '#/components/schemas/DirectionEnum'
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        description:
          type: string
          maxLength: 240
        occurred_on:
          type: string
          format: date
        sale:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        receipt:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        actor:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - actor
      - created_at
      - description
      - direction
      - id
      - occurred_on
      - receipt
      - sale
    ChannelEnum:
      enum:
      - direct
      - mercado_livre
      - shopee
      - other
      type: string
      description: |-
        * `direct` - Boca a boca
        * `mercado_livre` - Mercado Livre
        * `shopee` - Shopee
        * `other` - Outro
    CurrentUser:
      type: object
      properties:
        username:
          type: string
        is_superuser:
          type: boolean
        permissions:
          type: array
          items:
            type: string
      required:
      - is_superuser
      - permissions
      - username
    Dashboard:
      type: object
      properties:
        stock_value:
          type: string
        gross:
          type: string
        profit:
          type: string
        receivable:
          type: string
        cash_balance:
          type: string
        product_count:
          type: integer
      required:
      - cash_balance
      - gross
      - product_count
      - profit
      - receivable
      - stock_value
    DirectionEnum:
      enum:
      - in
      - out
      type: string
      description: |-
        * `in` - Entrada
        * `out` - Saída
    ItemInput:
      type: object
      properties:
        product_id:
          type: string
          format: uuid
        quantity:
          type: integer
          maximum: 1000000
          minimum: 1
        unit_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
      required:
      - product_id
      - quantity
      - unit_price
    ItemOutput:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        product:
          type: string
          format: uuid
        product_name:
          type: string
          maxLength: 200
        quantity:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        unit_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        unit_cost:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        cost_total:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
      required:
      - id
      - product
      - product_name
      - quantity
    Movement:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        product:
          type: string
          format: uuid
        product_name:
          type: string
          readOnly: true
        delta:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
        reason:
          type: string
          maxLength: 240
        balance_after:
          type: integer
          readOnly: true
        sale:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        actor:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        unit_cost:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          writeOnly: true
        receipt:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        value_delta:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
        value_after:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
      required:
      - actor
      - balance_after
      - created_at
      - delta
      - id
      - product
      - product_name
      - reason
      - receipt
      - sale
      - value_after
      - value_delta
    PaginatedCashList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Cash'
    PaginatedMovementList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Movement'
    PaginatedProductList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Product'
    PaginatedReceiptList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Receipt'
    PaginatedSaleList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Sale'
    PatchedProduct:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        sku:
          type: string
          maxLength: 80
        name:
          type: string
          maxLength: 200
        kind:
          $ref: '#/components/schemas/ProductKindEnum'
        description:
          type: string
        cost_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        sale_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        active:
          type: boolean
        printing:
          allOf:
          - $ref: '#/components/schemas/Printing'
          nullable: true
        quantity:
          type: integer
          readOnly: true
          default: 0
        stock_value:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          readOnly: true
          default: '0.00'
        average_cost:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,6})?$
          readOnly: true
          default: '0.000000'
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    PaymentInput:
      type: object
      properties:
        occurred_on:
          type: string
          format: date
      required:
      - occurred_on
    Printing:
      type: object
      properties:
        filament_price_kg:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        weight_g:
          type: string
          format: decimal
          pattern: ^-?\d{0,9}(?:\.\d{0,3})?$
        power_w:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        hours:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        minutes:
          type: integer
          maximum: 59
          minimum: 0
        energy_price_kwh:
          type: string
          format: decimal
