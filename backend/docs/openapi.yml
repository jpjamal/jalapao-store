components:
  schemas:
    Account:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        channel:
          allOf:
          - $ref: '#/components/schemas/MarketplaceChannelEnum'
          readOnly: true
        channel_label:
          type: string
          readOnly: true
        external_id:
          type: string
          readOnly: true
          description: shop_id na Shopee, user_id no ML
        name:
          type: string
          readOnly: true
        active:
          type: boolean
          readOnly: true
        token_valido:
          type: boolean
          readOnly: true
        authorization_expires_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        authorization_days_left:
          type: integer
          readOnly: true
          nullable: true
        last_synced_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        last_error:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - active
      - authorization_days_left
      - authorization_expires_at
      - channel
      - channel_label
      - created_at
      - external_id
      - id
      - last_error
      - last_synced_at
      - name
      - token_valido
    AccountStatus:
      type: object
      properties:
        accounts:
          type: array
          items:
            type: object
            additionalProperties: {}
      required:
      - accounts
    AuthLink:
      type: object
      properties:
        url:
          type: string
      required:
      - url
    AuthorizationAlert:
      type: object
      properties:
        channel:
          type: string
        channel_label:
          type: string
        name:
          type: string
        days_left:
          type: integer
        expires_at:
          type: string
      required:
      - channel
      - channel_label
      - days_left
      - expires_at
      - name
    BlankEnum:
      enum:
      - ''
    Cash:
      type: object
      description: |-
        Lançamento do Caixa. Manual exige categoria; depois de criado, só a categoria do manual muda
        (reclassificar). Valor, data, descrição e direção são imutáveis: correção é por lançamento inverso.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        direction:
          $ref: '#/components/schemas/CashDirectionEnum'
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        description:
          type: string
          maxLength: 240
        occurred_on:
          type: string
          format: date
        category:
          type: string
          format: uuid
        category_name:
          type: string
          readOnly: true
        origin:
          type: string
          readOnly: true
        sale:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        receipt:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        actor:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - actor
      - category_name
      - created_at
      - description
      - direction
      - id
      - occurred_on
      - origin
      - receipt
      - sale
    CashCategory:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 100
        direction:
          $ref: '#/components/schemas/CashCategoryDirectionEnum'
        counts_in_result:
          type: boolean
        active:
          type: boolean
        is_system:
          type: boolean
          readOnly: true
        entries_count:
          type: integer
          readOnly: true
          default: 0
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - direction
      - entries_count
      - id
      - is_system
      - name
      - updated_at
    CashCategoryDirectionEnum:
      enum:
      - in
      - out
      - both
      type: string
      description: |-
        * `in` - Entrada
        * `out` - Saída
        * `both` - Entrada ou saída
    CashDirectionEnum:
      enum:
      - in
      - out
      type: string
      description: |-
        * `in` - Entrada
        * `out` - Saída
    CashSummary:
      type: object
      properties:
        category:
          type: string
          format: uuid
        category_name:
          type: string
        is_system:
          type: boolean
        counts_in_result:
          type: boolean
        entries:
          type: integer
        in_total:
          type: string
        out_total:
          type: string
      required:
      - category
      - category_name
      - counts_in_result
      - entries
      - in_total
      - is_system
      - out_total
    Category:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 100
        uses_printing_profile:
          type: boolean
        active:
          type: boolean
        products_count:
          type: integer
          readOnly: true
          default: 0
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
      - products_count
      - updated_at
    CertificateStatus:
      type: object
      properties:
        expires_at:
          type: string
        days_left:
          type: integer
        alert:
          type: boolean
      required:
      - alert
      - days_left
      - expires_at
    ConditionEnum:
      enum:
      - new
      - used
      - reconditioned
      type: string
      description: |-
        * `new` - Novo
        * `used` - Usado
        * `reconditioned` - Recondicionado
    ConnectRequest:
      type: object
      properties:
        channel:
          type: string
        code:
          type: string
        external_id:
          type: string
        state:
          type: string
      required:
      - channel
      - code
      - external_id
      - state
    CurrentUser:
      type: object
      properties:
        username:
          type: string
        is_superuser:
          type: boolean
        permissions:
          type: array
          items:
            type: string
      required:
      - is_superuser
      - permissions
      - username
    Dashboard:
      type: object
      properties:
        stock_value:
          type: string
        gross:
          type: string
        profit:
          type: string
        realized_profit:
          type: string
        business_result:
          type: string
        receivable:
          type: string
        cash_balance:
          type: string
        product_count:
          type: integer
        unclassified_count:
          type: integer
        certificate:
          allOf:
          - $ref: '#/components/schemas/CertificateStatus'
          nullable: true
        authorization_alerts:
          type: array
          items:
            $ref: '#/components/schemas/AuthorizationAlert'
      required:
      - authorization_alerts
      - business_result
      - cash_balance
      - certificate
      - gross
      - product_count
      - profit
      - realized_profit
      - receivable
      - stock_value
      - unclassified_count
    DraftPublication:
      type: object
      properties:
        item_id:
          type: string
        permalink:
          type: string
        status:
          type: string
        titulo:
          type: string
        fotos:
          type: integer
        fotos_novas:
          type: integer
        estoque:
          type: integer
          nullable: true
        avisos:
          type: array
          items:
            type: string
      required:
      - avisos
      - estoque
      - fotos
      - fotos_novas
      - item_id
      - permalink
      - status
      - titulo
    DraftValidation:
      type: object
      properties:
        pode_publicar:
          type: boolean
        simulado_no_mercado_livre:
          type: boolean
        causas_de_foto_retiradas:
          type: integer
        categoria:
          type: object
          additionalProperties: {}
          nullable: true
        erros:
          type: array
          items:
            type: object
            additionalProperties: {}
        avisos:
          type: array
          items:
            type: object
            additionalProperties: {}
      required:
      - avisos
      - categoria
      - causas_de_foto_retiradas
      - erros
      - pode_publicar
      - simulado_no_mercado_livre
    ImportResult:
      type: object
      properties:
        total:
          type: integer
        vinculos_novos:
          type: integer
        pendentes:
          type: array
          items:
            type: object
            additionalProperties: {}
      required:
      - pendentes
      - total
      - vinculos_novos
    ItemInput:
      type: object
      properties:
        product_id:
          type: string
          format: uuid
        quantity:
          type: integer
          maximum: 1000000
          minimum: 1
        unit_price:
