openapi: 3.0.3
info:
  title: Jalapão Store API
  version: 1.0.0
paths:
  /auth/logout/:
    post:
      operationId: auth_logout_create
      description: |-
        Takes a token and blacklists it. Must be used with the
        `rest_framework_simplejwt.token_blacklist` app installed.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenBlacklist'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenBlacklist'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenBlacklist'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenBlacklist'
          description: ''
  /auth/me/:
    get:
      operationId: auth_me_retrieve
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
          description: ''
  /auth/refresh/:
    post:
      operationId: auth_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /auth/token/:
    post:
      operationId: auth_token_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: ''
  /cash/:
    get:
      operationId: cash_list
      parameters:
      - in: query
        name: category
        schema:
          type: string
          format: uuid
      - in: query
        name: date_from
        schema:
          type: string
          format: date
      - in: query
        name: date_to
        schema:
          type: string
          format: date
      - in: query
        name: direction
        schema:
          type: string
          enum:
          - in
          - out
        description: |-
          * `in` - Entrada
          * `out` - Saída
      - name: ordering
        required: false
        in: query
        description: Qual campo usar ao ordenar os resultados.
        schema:
          type: string
      - in: query
        name: origin
        schema:
          type: string
          enum:
          - manual
          - purchase
          - purchase_refund
          - sale
          - sale_refund
          - supply
          - supply_refund
        description: |-
          * `sale` - Venda
          * `sale_refund` - Estorno de venda
          * `purchase` - Compra de estoque
          * `purchase_refund` - Estorno de compra de estoque
          * `supply` - Compra de insumo
          * `supply_refund` - Estorno de compra de insumo
          * `manual` - Manual
      - name: page
        required: false
        in: query
        description: Um número de página dentro do conjunto de resultados paginado.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: Um termo de busca.
        schema:
          type: string
      tags:
      - cash
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCashList'
          description: ''
    post:
      operationId: cash_create
      tags:
      - cash
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Cash'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Cash'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Cash'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cash'
          description: ''
  /cash-categories/:
    get:
      operationId: cash_categories_list
      description: 'Sem DELETE: categoria sai de uso desativando (`active`). As do
        sistema são só de leitura.'
      parameters:
      - in: query
        name: active
        schema:
          type: boolean
      - in: query
        name: counts_in_result
        schema:
          type: boolean
      - in: query
        name: direction
        schema:
          type: string
          enum:
          - both
          - in
          - out
        description: |-
          * `in` - Entrada
          * `out` - Saída
          * `both` - Entrada ou saída
      - name: ordering
        required: false
        in: query
        description: Qual campo usar ao ordenar os resultados.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: Um número de página dentro do conjunto de resultados paginado.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: Um termo de busca.
        schema:
          type: string
      tags:
      - cash-categories
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCashCategoryList'
          description: ''
    post:
      operationId: cash_categories_create
      description: 'Sem DELETE: categoria sai de uso desativando (`active`). As do
        sistema são só de leitura.'
      tags:
      - cash-categories
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CashCategory'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CashCategory'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CashCategory'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashCategory'
          description: ''
  /cash-categories/{id}/:
    get:
      operationId: cash_categories_retrieve
      description: 'Sem DELETE: categoria sai de uso desativando (`active`). As do
        sistema são só de leitura.'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Um string UUID que identifica este cash category.
        required: true
      tags:
      - cash-categories
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashCategory'
          description: ''
    put:
      operationId: cash_categories_update
      description: 'Sem DELETE: categoria sai de uso desativando (`active`). As do
        sistema são só de leitura.'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Um string UUID que identifica este cash category.
        required: true
      tags:
      - cash-categories
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CashCategory'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CashCategory'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CashCategory'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashCategory'
          description: ''
    patch:
      operationId: cash_categories_partial_update
      description: 'Sem DELETE: categoria sai de uso desativando (`active`). As do
        sistema são só de leitura.'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Um string UUID que identifica este cash category.
        required: true
      tags:
      - cash-categories
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCashCategory'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCashCategory'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCashCategory'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashCategory'
          description: ''
  /cash/{id}/:
    patch:
      operationId: cash_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Um string UUID que identifica este cash entry.
        required: true
      tags:
      - cash
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCash'
          application/x-www-form-urlencoded:
            schema:
