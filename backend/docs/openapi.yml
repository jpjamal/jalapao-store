          additionalProperties: {}
          nullable: true
        erros:
          type: array
          items:
            type: object
            additionalProperties: {}
        avisos:
          type: array
          items:
            type: object
            additionalProperties: {}
      required:
      - avisos
      - categoria
      - causas_de_foto_retiradas
      - erros
      - pode_publicar
      - simulado_no_mercado_livre
    ImportResult:
