components:
  schemas:
    Account:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        channel:
          allOf:
          - $ref: '#/components/schemas/MarketplaceChannelEnum'
          readOnly: true
        channel_label:
          type: string
          readOnly: true
        external_id:
          type: string
          readOnly: true
          description: shop_id na Shopee, user_id no ML
        name:
          type: string
          readOnly: true
        active:
          type: boolean
          readOnly: true
        token_valido:
          type: boolean
          readOnly: true
        authorization_expires_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        authorization_days_left:
          type: integer
          readOnly: true
          nullable: true
        last_synced_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        last_error:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - active
      - authorization_days_left
      - authorization_expires_at
      - channel
      - channel_label
      - created_at
      - external_id
      - id
      - last_error
      - last_synced_at
      - name
      - token_valido
    AccountStatus:
      type: object
      properties:
        accounts:
          type: array
          items:
            type: object
            additionalProperties: {}
      required:
      - accounts
    AuthLink:
      type: object
      properties:
        url:
          type: string
      required:
      - url
    AuthorizationAlert:
      type: object
      properties:
        channel:
          type: string
        channel_label:
          type: string
        name:
          type: string
        days_left:
          type: integer
        expires_at:
          type: string
      required:
      - channel
      - channel_label
      - days_left
      - expires_at
      - name
    BlankEnum:
      enum:
      - ''
    Cash:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        direction:
          $ref: '#/components/schemas/DirectionEnum'
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        description:
          type: string
          maxLength: 240
        occurred_on:
          type: string
          format: date
        sale:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        receipt:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        actor:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - actor
      - created_at
      - description
      - direction
      - id
      - occurred_on
      - receipt
      - sale
    CertificateStatus:
      type: object
      properties:
        expires_at:
          type: string
        days_left:
          type: integer
        alert:
          type: boolean
      required:
      - alert
      - days_left
      - expires_at
    ConditionEnum:
      enum:
      - new
      - used
      - reconditioned
      type: string
      description: |-
        * `new` - Novo
        * `used` - Usado
        * `reconditioned` - Recondicionado
    ConnectRequest:
      type: object
      properties:
        channel:
          type: string
        code:
          type: string
        external_id:
          type: string
        state:
          type: string
      required:
      - channel
      - code
      - external_id
      - state
    CurrentUser:
      type: object
      properties:
        username:
          type: string
        is_superuser:
          type: boolean
        permissions:
          type: array
          items:
            type: string
      required:
      - is_superuser
      - permissions
      - username
    Dashboard:
      type: object
      properties:
        stock_value:
          type: string
        gross:
          type: string
        profit:
          type: string
        receivable:
          type: string
        cash_balance:
          type: string
        product_count:
          type: integer
        certificate:
          allOf:
          - $ref: '#/components/schemas/CertificateStatus'
          nullable: true
        authorization_alerts:
          type: array
          items:
            $ref: '#/components/schemas/AuthorizationAlert'
      required:
      - authorization_alerts
      - cash_balance
      - certificate
      - gross
      - product_count
      - profit
      - receivable
      - stock_value
    DirectionEnum:
      enum:
      - in
      - out
      type: string
      description: |-
        * `in` - Entrada
        * `out` - Saída
    DraftPublication:
