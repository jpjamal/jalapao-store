[project]
name = "jalapao-store-backend"
version = "1.0.0"
description = "Gestão comercial da Jalapão Store"
authors = [{name = "jpjamal", email = "jpfisica3@gmail.com"}]
requires-python = ">=3.11,<3.15"
dependencies = [
  "Django>=5.2.17,<5.3", "djangorestframework==3.18.1",
  "djangorestframework-simplejwt==5.5.1", "psycopg[binary]==3.3.6",
  "gunicorn==26.2.0", "whitenoise==6.12.0", "drf-spectacular==0.30.0", "django-filter==26.1",
]

[dependency-groups]
dev = ["ruff>=0.12,<1"]

[tool.uv]
package = false

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
