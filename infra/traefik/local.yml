# Traefik só da cópia local (docker-compose.yml): as mesmas rotas da produção, sem HTTPS.
# Em produção as rotas vêm dos labels de docker-compose.deploy.yml, no Traefik central.
http:
  routers:
    admin:
      rule: PathPrefix(`/jalapao-store/admin/`) || PathPrefix(`/jalapao-store/django-static/`)
      priority: 200
      service: backend
    front:
      rule: PathPrefix(`/jalapao-store`)
      service: frontend
  services:
    backend:
      loadBalancer:
        servers: [{url: "http://backend:8000"}]
    frontend:
      loadBalancer:
        servers: [{url: "http://frontend:3000"}]
