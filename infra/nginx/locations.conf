client_max_body_size 5m;
location = /health { access_log off; return 200 'ok'; add_header Content-Type text/plain; }
location /manuais/ { alias /srv/manuais/; autoindex off; }
location /jalapao-store/admin/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
}
location /jalapao-store/django-static/ { proxy_pass http://backend:8000; proxy_set_header Host $http_host; }
location = /jalapao-store/callback {
    access_log off;
    add_header Referrer-Policy no-referrer always;
    proxy_pass http://frontend:3000;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
}
location /jalapao-store/backend-api/ {
    proxy_pass http://backend:8000/api/v1/;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
}
location /jalapao-store {
    proxy_pass http://frontend:3000;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 60s;
}
location / { return 404; }
