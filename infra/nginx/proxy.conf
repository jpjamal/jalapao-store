# Reverse proxy interno: Traefik termina TLS e entrega apenas HTTP pela rede Docker.
server {
    listen 8080;
    server_name _;
    set $jalapao_forwarded_proto https;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    include /etc/nginx/jalapao-locations.conf;
}
