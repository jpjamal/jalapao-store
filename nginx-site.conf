server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # o site é tudo estático e pequeno; compactar vale para o etiquetas.html
    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json text/markdown;
    gzip_min_length 1024;

    # HTML sempre fresco — o site muda a cada deploy
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    # css e js precisam revalidar sempre: o site publica direto, e HTML novo
    # rodando com modulo antigo em cache ja quebrou a lista de produtos uma vez.
    # no-cache nao significa "sem cache": o navegador reusa o arquivo depois de
    # perguntar se mudou (304), entao continua barato.
    location ~* \.(css|js)$ {
        add_header Cache-Control "no-cache";
    }

    # imagem muda pouco e ficar velha nao quebra nada
    location ~* \.(svg|png|jpg|jpeg|ico)$ {
        add_header Cache-Control "public, max-age=86400";
    }

    # manuais: PDF entregue por SSH em volume, público
    location /manuais/ {
        add_header Cache-Control "public, max-age=86400";
        autoindex off;
    }

    # quem chegar na raiz do container vai para o site
    location = / {
        return 302 /jalapao-store/;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
