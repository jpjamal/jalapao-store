server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # o site é tudo estático e pequeno; compactar vale para o etiquetas.html
    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json text/markdown;
    gzip_min_length 1024;

    # HTML sempre fresco — o site muda a cada deploy
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    # css, js e imagens podem ficar em cache curto
    location ~* \.(css|js|svg|png|jpg|ico)$ {
        add_header Cache-Control "public, max-age=3600";
    }

    # manuais: PDF entregue por SSH em volume, público
    location /manuais/ {
        add_header Cache-Control "public, max-age=86400";
        autoindex off;
    }

    # quem chegar na raiz do container vai para o site
    location = / {
        return 302 /jalapao-store/;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
