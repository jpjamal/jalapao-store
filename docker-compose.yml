# Para rodar na sua máquina, sem Traefik: docker compose up
# Depois abra http://localhost:8080/jalapao-store/
services:
  jalapao-store:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jalapao-store-local
    ports:
      - "8080:80"
    volumes:
      - ./manuais:/usr/share/nginx/html/manuais:ro
    restart: unless-stopped

  jalapao-api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: jalapao-api-local
    ports:
      - "8001:8000"
    volumes:
      - ./dados:/dados
    restart: unless-stopped
